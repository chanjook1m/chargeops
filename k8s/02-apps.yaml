# Render with: python scripts/render_manifest.py --image DOCKERHUB_ID/chatops-csms-lab:v1
apiVersion: v1
kind: Service
metadata:
  name: alert-router
  namespace: chargeops
spec:
  type: ClusterIP
  selector:
    app: alert-router
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: mock-csms
  namespace: chargeops
spec:
  type: ClusterIP
  selector:
    app: mock-csms
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-router
  namespace: chargeops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-router
  template:
    metadata:
      labels:
        app: alert-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: router
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "app.router:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: chatops-config
            - secretRef:
                name: router-credentials
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 400m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-csms
  namespace: chargeops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-csms
  template:
    metadata:
      labels:
        app: mock-csms
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: csms
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "app.csms:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: chatops-config
            - secretRef:
                name: csms-credentials
          volumeMounts:
            - name: demo-data
              mountPath: /data
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 400m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: demo-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-bot
  namespace: chargeops
spec:
  replicas: 1
  strategy:
    type: Recreate  # 데모 중 기존 WebSocket 세션과 새 세션의 중복을 줄임
  selector:
    matchLabels:
      app: chatops-bot
  template:
    metadata:
      labels:
        app: chatops-bot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: bot
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.bot"]
          envFrom:
            - configMapRef:
                name: chatops-config
            - secretRef:
                name: slack-credentials
            - secretRef:
                name: bot-backend-credentials
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 400m, memory: 256Mi}
